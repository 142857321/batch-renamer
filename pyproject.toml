[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-renamer"
version = "0.1.0"
description = "Preview-first batch file renamer: rename by find/replace, prefix/suffix, regex and numbering."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["rename", "files", "cli", "batch", "automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]

[project.scripts]
renamer = "renamer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["renamer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
